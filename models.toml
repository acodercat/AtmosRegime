# Model registry: one section per model config, used by every model call in this repository
# (`atmoscoder_rl.evaluation.client`; e.g. `evaluation.runner --model <section>`).
#
# No secrets in this file. A hosted model names the environment variable holding its key
# (`api_key_env`); a local vLLM server takes the placeholder key "EMPTY". The allowed fields
# and their meaning are documented in atmoscoder_rl/evaluation/client.py.
#
# The four local entries reproduce the ones stage 1 (explore/REPORT.md) ran with on host-A,
# recovered 2026-09-26; `explore/e1_run.sh` serves the weights as "local" on port 8077.

[local-e1-off]            # E1 and later, thinking off
model_id = "local"
base_url = "http://127.0.0.1:8077/v1"
api_key = "EMPTY"
temperature = 0.3
max_tokens = 8192
timeout = 1800.0
thinking_echo_field = "reasoning"      # vLLM >= 0.24 names the reasoning field `reasoning`
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[local-e1-on]             # E1 and later, thinking on (40k context: 28672 generation + prompt headroom)
model_id = "local"
base_url = "http://127.0.0.1:8077/v1"
api_key = "EMPTY"
temperature = 0.6
max_tokens = 28672
timeout = 1800.0
thinking_echo_field = "reasoning"
extra_body = { chat_template_kwargs = { enable_thinking = true } }

[local-e1-on-32k]         # thinking models with a 32k context (Phi-4-reasoning): 8192 of prompt headroom
model_id = "local"
base_url = "http://127.0.0.1:8077/v1"
api_key = "EMPTY"
temperature = 0.6
max_tokens = 24576
timeout = 1800.0
thinking_echo_field = "reasoning"
extra_body = { chat_template_kwargs = { enable_thinking = true } }

[local-e4-off]            # E4 (sampling consistency): local-e1-off at a sampling temperature
model_id = "local"
base_url = "http://127.0.0.1:8077/v1"
api_key = "EMPTY"
temperature = 0.7
max_tokens = 8192
timeout = 1800.0
thinking_echo_field = "reasoning"
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[local-e3-off]            # E3 knowledge probe (explore/e3_probe.py), thinking off: a verdict, not a solution
model_id = "local"
base_url = "http://127.0.0.1:8077/v1"
api_key = "EMPTY"
temperature = 0.3
max_tokens = 2048
timeout = 1800.0
thinking_echo_field = "reasoning"
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[local-e3-on]             # E3 knowledge probe, thinking on
model_id = "local"
base_url = "http://127.0.0.1:8077/v1"
api_key = "EMPTY"
temperature = 0.6
max_tokens = 16384
timeout = 1800.0
thinking_echo_field = "reasoning"
extra_body = { chat_template_kwargs = { enable_thinking = true } }

[local-raft]              # RAFT sampling / admission probe (sample_raft.py): the RL rollout settings
model_id = "local"
base_url = "http://127.0.0.1:8077/v1"
api_key = "EMPTY"
temperature = 1.0
max_tokens = 3072         # the RL response cap
timeout = 900.0
extra_body = { top_p = 1.0, chat_template_kwargs = { enable_thinking = false } }

[local-raft-plain]        # local-raft without chat_template_kwargs: Mistral-tokenizer vLLM servers reject it (Ministral 3; it has no thinking switch)
model_id = "local"
base_url = "http://127.0.0.1:8077/v1"
api_key = "EMPTY"
temperature = 1.0
max_tokens = 3072
timeout = 900.0
extra_body = { top_p = 1.0 }

[judge]                   # the wrong-answer judge (explore/judge_regime.py): deepseek-v4-flash-reasoning at T = 0
model_id = "deepseek-v4-flash-260425"
base_url = "https://YOUR-ENDPOINT/v1"  # an OpenAI-compatible endpoint serving this model
api_key_env = "GATEWAY_A_API_KEY"
temperature = 0.0
max_tokens = 12000
timeout = 600.0
extra_body = { thinking = { type = "enabled" }, reasoning_effort = "high" }
retry_status = [404]      # the gateway returns intermittent 404s

[judge-oneapi]            # X1b thinking-trace judge (explore/x1_trace_judge.py): the gateway that is reachable from the
model_id = "deepseek-v4-flash"   # training boxes, thinking off, T = 0 (the `judge` entry's key is not available there; D-4 note 2026-10-12)
